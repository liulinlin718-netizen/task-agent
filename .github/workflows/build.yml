name: Build & Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/check.yml

  package:
    name: Package ${{ matrix.target }}
    needs: verify
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            os: macos-15
            arch: arm64
            command: npm run build:mac -- --arm64 --publish never
            executable: release/mac-arm64/TaskAgent.app/Contents/MacOS/TaskAgent
          - target: mac-x64
            os: macos-15-intel
            arch: x64
            command: npm run build:mac -- --x64 --publish never
            executable: release/mac/TaskAgent.app/Contents/MacOS/TaskAgent
          - target: win-x64
            os: windows-2025
            arch: x64
            command: npm run build:exe -- --x64 --publish never
            executable: release/win-unpacked/TaskAgent.exe
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Verify release version and changelog
        run: node scripts/release.mjs preflight
      - run: npm ci
      - run: npm run setup:electron
      - name: Build native installers without publishing
        run: ${{ matrix.command }}
      - name: Verify packaged executable architecture
        run: node scripts/release.mjs executable ${{ matrix.target }} "${{ matrix.executable }}"
      - name: Test packaged application with isolated profiles and local model fixtures
        run: npm run test:e2e
        env:
          TASKAGENT_E2E_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
      - name: Validate and hash installers
        run: node scripts/release.mjs stage ${{ matrix.target }}
      - name: Preserve packaged test failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-failure-${{ matrix.target }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload verified installers and manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: release/staging/${{ matrix.target }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Verify all assets and publish once
    needs: [verify, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release/downloads/
      - name: Verify complete asset set and create SHA256SUMS
        run: node scripts/release.mjs aggregate
      - name: Upload to draft, verify uploaded bytes, then publish
        run: node scripts/release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
